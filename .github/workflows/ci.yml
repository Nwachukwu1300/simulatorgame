name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22 # 22.18+ runs the .ts unit tests natively
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # GitHub runners have no GPU: Chrome renders the 3D scenes in software, Firefox
      # and WebKit can't. Run those two locally with `npm run test:e2e`.
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- --project=chromium --project=no-webgl
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
